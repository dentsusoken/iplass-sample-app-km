// === Tomcat deploy & lifecycle ===
// ここで定義している deploy / tomcatStart などのタスクは、mise の deploy / tomcat-* タスクが内部で呼び出します。
// 普段は mise 経由で実行してください。mise が CATALINA_HOME を自動的に設定します。
// これらのタスクを直接実行する場合は、CATALINA_HOME 環境変数を事前に設定しておく必要があります。
// e2e.config.json は .gitignore 済みのローカル設定で、配布物やクリーンな clone には含まれない。
// 評価時に必須で読むとこのファイルが無い環境で gradle が一切動かなくなるため、存在するときだけ読み、
// 無ければ既定ポートを使う（実際に E2E を回す環境ではこのファイルを用意する）。
def e2eConfigFile = file('e2e-integration/e2e.config.json')
def tomcatHttpPort = e2eConfigFile.exists() ? (new groovy.json.JsonSlurper().parse(e2eConfigFile).port as int) : 8080
def tomcatShutdownPort = tomcatHttpPort + 5

def requireCatalinaHome() {
	def home = System.getenv('CATALINA_HOME')
	if (!home) {
		throw new GradleException(
			'CATALINA_HOME is not set. Set it before running Gradle.\n' +
			'  Example (mise):   export CATALINA_HOME="$(mise where tomcat)/apache-tomcat-<ver>"\n' +
			'  Example (manual): export CATALINA_HOME=/opt/tomcat'
		)
	}
	def dir = new File(home)
	if (!dir.isDirectory()) {
		throw new GradleException("CATALINA_HOME does not exist: ${home}")
	}
	return home
}

// deploy 系タスクで共有する、デプロイ操作のヘルパー関数です。
// ext.X = { ... } で project のプロパティに登録すると、タスク内（クロージャ）から呼び出せます。

// 展開済みの WAR ディレクトリと既存の WAR ファイルを削除してから、指定された WAR を deployedWarName という名前で配置します。
ext.deployWarFile = { String catalinaHome, sourceWar, String deployedWarName ->
	def baseName = deployedWarName.replaceFirst(/\.war$/, '')
	def expandedDir = file("${catalinaHome}/webapps/${baseName}")
	if (expandedDir.exists()) {
		delete expandedDir
		logger.lifecycle("Deleted expanded WAR: ${expandedDir}")
	}
	def deployedWar = file("${catalinaHome}/webapps/${deployedWarName}")
	if (deployedWar.exists()) {
		delete deployedWar
	}
	logger.lifecycle("Deploying to: ${catalinaHome} as ${deployedWarName}")
	copy {
		from sourceWar
		into "${catalinaHome}/webapps"
		rename '.*\\.war', deployedWarName
	}
}

// lib/jdbc 配下の jar を Tomcat の lib へコピーします。jar が複数ある場合は警告を出します。
ext.copyJdbcJarsToTomcat = { String catalinaHome ->
	def jdbcJars = fileTree('lib/jdbc').matching { include '*.jar' }.files
	if (jdbcJars.size() > 1) {
		logger.warn("WARNING: lib/jdbc/ contains ${jdbcJars.size()} JAR files: ${jdbcJars*.name}")
		logger.warn("All will be copied to Tomcat lib/. Ensure only the required JDBC driver is present.")
	}
	copy {
		from 'lib/jdbc'
		into "${catalinaHome}/lib"
		include '*.jar'
	}
}

// server.xml の HTTP ポートと Shutdown ポートを、e2e.config.json の値で書き換えます。
ext.patchTomcatServerXmlPorts = { String catalinaHome ->
	ant.replace(file: "${catalinaHome}/conf/server.xml") {
		replacefilter(token: 'port="8080"', value: "port=\"${tomcatHttpPort}\"")
		replacefilter(token: 'port="8005"', value: "port=\"${tomcatShutdownPort}\"")
	}
}

task deploy {
	description 'Build WAR and deploy to Tomcat (requires CATALINA_HOME)'
	dependsOn war
	doLast {
		def catalinaHome = requireCatalinaHome()
		project.deployWarFile(catalinaHome, war.archiveFile, "${war.archiveBaseName.get()}.war")
		project.copyJdbcJarsToTomcat(catalinaHome)
		project.patchTomcatServerXmlPorts(catalinaHome)
	}
}

task tomcatStart {
	description "Start Tomcat (port ${tomcatHttpPort}, requires CATALINA_HOME)"
	doLast {
		def catalinaHome = requireCatalinaHome()
		def isWindows = org.gradle.internal.os.OperatingSystem.current().isWindows()
		def cmd = isWindows ? ['cmd', '/c', 'startup.bat'] : ['./startup.sh']
		def pb = new ProcessBuilder(cmd)
			.directory(new File("${catalinaHome}/bin"))
			.inheritIO()
		pb.environment().put('CATALINA_HOME', catalinaHome)
		pb.start()
		logger.lifecycle("Tomcat starting on http://localhost:${tomcatHttpPort}")
	}
}

task tomcatStartDebug {
	description "Start Tomcat with JPDA debugger on port 5005 (requires CATALINA_HOME)"
	doLast {
		def catalinaHome = requireCatalinaHome()
		def isWindows = org.gradle.internal.os.OperatingSystem.current().isWindows()
		def cmd = isWindows ? ['cmd', '/c', 'catalina.bat', 'jpda', 'start'] : ['./catalina.sh', 'jpda', 'start']
		def pb = new ProcessBuilder(cmd)
			.directory(new File("${catalinaHome}/bin"))
			.inheritIO()
		pb.environment().put('CATALINA_HOME', catalinaHome)
		pb.environment().put('JPDA_ADDRESS', '*:5005')
		pb.environment().put('JPDA_TRANSPORT', 'dt_socket')
		pb.environment().put('JPDA_SUSPEND', 'n')
		pb.start()
		logger.lifecycle("Tomcat starting on http://localhost:${tomcatHttpPort} (JPDA debug on port 5005)")
	}
}

task tomcatStop {
	description 'Stop Tomcat (requires CATALINA_HOME)'
	doLast {
		def catalinaHome = requireCatalinaHome()
		def isWindows = org.gradle.internal.os.OperatingSystem.current().isWindows()
		try {
			exec {
				workingDir "${catalinaHome}/bin"
				commandLine isWindows ? ['cmd', '/c', 'shutdown.bat'] : ['./shutdown.sh']
				environment 'CATALINA_HOME', catalinaHome
			}
		} catch (e) {
			logger.warn("Tomcat stop skipped (not running): ${e.message}")
		}
	}
}

task redeploy {
	description 'Stop → rebuild WAR → deploy → start (requires CATALINA_HOME)'
	dependsOn tomcatStop, deploy, tomcatStart
}
deploy.mustRunAfter tomcatStop
tomcatStart.mustRunAfter deploy

// 全文検索インデックスを crawl（構築・更新）するツールを実行します。
// EntityDataCrawler は Lucene のインデックスを相対パス（.lucene/index）に出力します。そのため、稼働中の
// サーバーが参照するインデックスと一致させるには、workingDir を Tomcat と同じ ${CATALINA_HOME}/bin に揃える必要があります。
// 引数は mode（CRAWL または RECRAWL）、tenantId（-1 で全テナント）、entityName（任意。CRAWL のときだけ指定可）です。
// --args を指定しない場合は、全テナントを CRAWL します。例: gradlew crawlFulltextSearch --args="RECRAWL -1"
task crawlFulltextSearch(type: JavaExec, group: 'application', description: 'Crawl entities into the Lucene fulltext index (requires CATALINA_HOME).') {
	mainClass = 'org.iplass.mtp.tools.batch.fulltextsearch.EntityDataCrawler'
	classpath = sourceSets.main.runtimeClasspath
	args 'CRAWL', '-1'
	doFirst {
		workingDir = "${requireCatalinaHome()}/bin"
		logger.lifecycle("Crawling fulltext index under ${workingDir}/.lucene/index (args: ${args})")
	}
}

